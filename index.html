<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="spot"/><meta name="author" content="Arielle Palmer"/><meta name="keywords" content="HTML, CSS"/><link rel="icon" href="favicon.ico"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img class="header__logo" src="d3610e9c6dce3cb370d8.svg"/></header><main class="content"><section class="profile page__section"><img id="Bessie-Coleman" alt="Bessie Coleman" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Arielle Palmer</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img id="pencil" alt="pencil icon"/>Edit Profile</button></div><button type="button" class="profile__new-post-btn"><img id="plus-icon" alt="plus icon"/> New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><img src="" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button> <button type="button" class="card__delete-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__copyright">2024 © Spots</p></footer><div class="modal" id="edit-modal"><div class="modal__container"><button type="button" class="modal__close"></button><h2 class="modal__title">Edit Profile</h2><form name="edit-profile-form" class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" placeholder="Type your name" class="modal__input" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" placeholder="Describe yourself" class="modal__input" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close"></button><h2 class="modal__title">New Post</h2><form name="new-post-form" class="modal__form" novalidate><label for="new-post-link-input" class="modal__label">Image link <input id="new-post-link-input" placeholder="Paste a link to the picture" type="url" class="modal__input" required/> <span id="new-post-link-input-error" class="modal__error"></span></label> <label for="new-post-name-input" class="modal__label">Caption <input id="new-post-name-input" placeholder="Type your caption" class="modal__input" minlength="2" maxlength="30" required/> <span id="new-post-name-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save-button">Save</button></form></div></div></div><div class="modal" id="preview-modal"><div class="modal__content modal__content_type_preview"><button type="button" class="modal__close modal__close_type_preview"></button> <img class="modal__image" src="" alt=""/><p class="modal__caption"></p></div></div></body></html>
